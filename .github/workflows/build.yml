name: Build XiaoYu XY-C5 OpenWrt

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'config/**'
      - '.github/workflows/build.yml'

env:
  TZ: Asia/Shanghai
  UPSTREAM_REPO: https://github.com/openwrt/openwrt
  UPSTREAM_SHA: dd72c4c198330e208c2357625693a03996cae741
  CONFIG_FILE: config/xiaoyu_xy-c5.config

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 1. 初始化环境与磁盘空间
        run: |
          sudo apt-get remove -y -qq needrestart >/dev/null 2>&1 || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev file wget squashfs-tools
          df -h /

      - name: 2. 签出本仓库
        uses: actions/checkout@v4

      - name: 3. 克隆上游源码（优先固定 commit，失败回退 main）
        run: |
          umask 0022
          mkdir -p openwrt && cd openwrt
          git init -q
          git remote add origin "$UPSTREAM_REPO"
          git fetch -q --depth 1 origin main
          git checkout -q FETCH_HEAD
          if git fetch -q --depth 1 origin "$UPSTREAM_SHA"; then
            git checkout -q FETCH_HEAD
            echo "已切换到固定 commit $UPSTREAM_SHA"
          else
            echo "固定 commit 拉取失败，保留 main 最新"
          fi
          git log -1 --format='HEAD %H %cd %s'

      - name: 4. 更新并安装 feeds
        working-directory: openwrt
        run: |
          umask 0022
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 5. 载入配置并 make defconfig 补全
        run: |
          umask 0022
          cp "$CONFIG_FILE" openwrt/.config
          cd openwrt
          make defconfig

      - name: 6. 配置自检
        working-directory: openwrt
        run: |
          echo '===== 设备选择 ====='
          grep -E '^CONFIG_TARGET_ramips' .config || true
          echo '===== 必须存在 ====='
          for k in luci luci-app-firewall odhcp6c odhcpd-ipv6only 6in4 6rd 6to4 kmod-nft-offload kmod-nf-flow kmod-nf-conntrack-netlink; do
            printf '%-30s %s\n' "$k" "$(grep -E "^CONFIG_PACKAGE_${k}=" .config || echo MISSING)"
          done
          echo '===== 禁止包（出现即失败）====='
          if grep -qE '^CONFIG_PACKAGE_(uboot-envtools|opkg)=y' .config; then
            echo '::error::.config 中出现 uboot-envtools 或 opkg，与官方镜像行为不一致'
            grep -E '^CONFIG_PACKAGE_(uboot-envtools|opkg)=' .config
            exit 1
          fi
          echo 'OK 无 uboot-envtools / opkg'

      - name: 7. 下载依赖
        working-directory: openwrt
        run: |
          umask 0022
          make download -j"$(nproc)"
          find dl -size -1024c -exec rm -f {} + 2>/dev/null || true

      - name: 8. 编译固件
        working-directory: openwrt
        run: |
          umask 0022
          make -j"$(nproc)" || make -j1 || make -j1 V=s

      - name: 9. 产物自检
        working-directory: openwrt
        run: |
          D=bin/targets/ramips/mt7621
          ls -l "$D" || true
          M=$(ls "$D"/*.manifest | head -1)
          echo "===== 包数量 $(wc -l < "$M") ====="
          echo '===== 关键包（必须全部出现）====='
          BAD=0
          for p in base-files busybox procd ubus netifd firewall4 dnsmasq odhcp6c odhcpd-ipv6only luci luci-app-firewall 6in4 6rd 6to4 kmod-nft-offload kmod-nf-flow; do
            if grep -qE "^${p} - " "$M"; then
              printf 'OK   %-24s %s\n' "$p" "$(grep -E "^${p} - " "$M")"
            else
              printf 'MISS %s\n' "$p"
              BAD=1
            fi
          done
          echo '===== 禁止包（必须全部缺席）====='
          for p in uboot-envtools opkg; do
            if grep -qE "^${p} - " "$M"; then
              echo "::error::镜像中出现禁止包 $p"
              BAD=1
            else
              printf 'OK   %s 不存在\n' "$p"
            fi
          done
          echo '===== 早期启动钩子检查 ====='
          if command -v unsquashfs >/dev/null 2>&1; then
            if unsquashfs -l "$D"/*sysupgrade.bin 2>/dev/null | grep -qE 'fw_loadenv|30_uboot-envtools|05_fw_defaults'; then
              echo '::error::rootfs 内出现 uboot-envtools 早期启动钩子'
              BAD=1
            else
              echo 'OK 无 uboot-envtools 早期启动钩子'
            fi
          else
            echo '警告 无 unsquashfs，跳过该检查'
          fi
          echo '===== 镜像 ====='
          ls -l "$D"/*sysupgrade.bin "$D"/*initramfs-kernel.bin 2>/dev/null || true
          if [ "$BAD" = "1" ]; then echo '::error::产物自检未通过'; exit 1; fi
          echo '产物自检通过'

      - name: 10. 发布到 Release
        working-directory: openwrt
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          D=bin/targets/ramips/mt7621
          TAG=$(date +%Y.%m.%d-%H%M)
          REV=$(git log -1 --format=%h)
          gh release create "$TAG" "$D"/*.bin "$D"/*.manifest "$D"/*.buildinfo "$D"/profiles.json "$D"/sha256sums --repo "${{ github.repository }}" --title "XY-C5 $TAG" --notes "上游 openwrt/openwrt @ ${REV}，ramips/mt7621，设备 xiaoyu_xy-c5。完整配置见附带的 config.buildinfo。"

      - name: 11. 仅保留最近 3 个 Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName' | sort -r | tail -n +4 | while read -r t; do
            [ -n "$t" ] || continue
            echo "删除旧 Release $t"
            gh release delete "$t" --yes --cleanup-tag --repo "${{ github.repository }}" || true
          done
